---
layout: default
title: Blog
permalink: /blog
---

<h2 class="section-title">Blog</h2>

{% if site.posts.size > 0 %}
<ul class="blog-list">
  {% for post in site.posts %}
    <li>
      <a href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a>
      <span class="post-date">{{ post.date | date: "%B %d, %Y" }}</span>
    </li>
  {% endfor %}
</ul>
{% else %}
<p>No posts yet — check back soon!</p>
{% endif %}
